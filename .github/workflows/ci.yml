name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-minilm-bm25-v1
      - run: uv sync --frozen
      # offline: LLM calls are replayed from tests/fixtures, Qdrant runs in memory
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run build
